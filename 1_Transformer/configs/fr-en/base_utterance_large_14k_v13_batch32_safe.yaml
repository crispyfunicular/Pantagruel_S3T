# Baseline ST utterance Large 14k v13 — batch effectif 32, warmup long (piste B relance).
#
# Base : run_026 v5 (SpecAugment 0.05, batch 8, warmup 4k, LR 1e-4 — 26,12 BLEU test).
# run_046 (batch 32, warmup 4k, LR 1e-4) → collapse 2,76 BLEU.
# Corrections appliquées (deux variables vs run_046 — justifié car run_046 est un échec total) :
#   1. warmup_updates 4k → 15k : le décodeur a besoin de plus de pas pour stabiliser ses
#      embeddings avant que les gradients ne traversent l'encodeur.
#   2. learning_rate_peak 1e-4 → 5e-5 : LR linéaire avec le batch size effectif
#      (règle de mise à l'échelle du LR de Goyal et al. 2017).
#
# Note : on garde batch_size=1, gradient_accumulation=32 (pas batch_size=8 qui risque l'OOM
# sur L-14k — séquences audio longues ~2–4 s → tenseurs ~[8,3000,1024] en fp16 ≈ 24 Go).
#
# Encodeur L-14k — OVH recommandé (Modyco HS ; ~8–12 h GPU).
# Run cible : run_065_transformer_baseline_utterance_large_14k_v13_batch32_safe

experiment:
  name: "fr-en_baseline_utterance_large_14k_v13_batch32_safe"
  lang_pair: "fr-en"
  output_dir: "runs/fr-en/run_065_transformer_baseline_utterance_large_14k_v13_batch32_safe"
  seed: 42
  deterministic: true

data:
  segment_mode: "utterance"
  train_manifest: "datasets/manifests/fr-en/train.tsv"
  valid_manifest: "datasets/manifests/fr-en/valid.tsv"
  test_manifest: "datasets/manifests/fr-en/test.tsv"
  spm_model: "datasets/processed/spm/fr-en_1000.model"
  sample_rate: 16000

model:
  encoder_name: "PantagrueLLM/speech-large-14K"
  trust_remote_code: true
  decoder_layers: 6
  decoder_heads: 8
  hidden_dim: 1024
  dropout: 0.1

spec_augment:
  enabled: true
  mask_time_prob: 0.05
  mask_time_length: 10

train:
  max_updates: 80000
  warmup_updates: 15000
  freeze_encoder_updates: 5000
  learning_rate_peak: 0.00005
  weight_decay: 0.01
  label_smoothing: 0.1
  batch_size: 1
  gradient_accumulation: 32
  gradient_clip_norm: 1.0
  amp_dtype: "fp16"
  eval_every_updates: 2000
  max_eval_batches: null
  max_target_tokens: 256
  early_stopping_patience: 4

decode:
  beam_size: 5
  max_len_b: 128
