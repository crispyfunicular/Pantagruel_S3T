# Baseline open Whisper-ST — fr→en direct (task=translate, sentence_like m-TEDx).
# Filet de sécurité : aucune dépendance supplémentaire (transformers déjà installé).

experiment:
  name: "fr-en_whisper_large_v3_st_sentence"
  lang_pair: "fr-en"
  output_dir: "runs/fr-en/run_080_open_whisper_st_sentence"

data:
  segment_mode: "sentence_like"
  valid_manifest: "datasets/manifests_sentence/fr-en/valid.tsv"
  test_manifest: "datasets/manifests_sentence/fr-en/test.tsv"

model:
  type: "whisper_st"
  model_id: "openai/whisper-large-v3"
  whisper_language: "fr"
  device: "cuda"
  dtype: "float16"

decode:
  max_new_tokens: 256
